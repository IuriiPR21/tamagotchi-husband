
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тамагочи Муж ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#251c39;color:white;font-family:system-ui,sans-serif}
main{max-width:550px;margin:auto;padding:16px}
h1{text-align:center;color:#ffb4d4;text-shadow:3px 3px #663c76}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat,.panel{background:#473552;border:3px solid #ad84b6;border-radius:17px;padding:12px}
.stat{font-size:13px;font-weight:bold}
.track{height:12px;background:#241b35;border-radius:12px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ff9bc3,#f65e9b);transition:width .3s}
.room{position:relative;margin:15px 0;border:4px solid #ad84b6;border-radius:22px;min-height:315px;background:linear-gradient(#655077 70%,#886785 70%);overflow:hidden;text-align:center}
.window{position:absolute;right:12px;top:12px;font-size:55px}
.lamp{position:absolute;left:12px;top:12px;font-size:40px}
.bubble{position:relative;z-index:2;background:#fff0e9;color:#382940;border:3px solid #60405b;border-radius:22px;padding:12px;margin:15px 15px 0;font-weight:800;min-height:65px}
.character{position:relative;width:185px;height:185px;margin:12px auto 0;animation:bob 2s ease-in-out infinite}
.hoodie{position:absolute;top:112px;left:15px;width:155px;height:90px;background:#dfc9b4;border:5px solid #493249;border-radius:48% 48% 0 0}
.face{position:absolute;top:19px;left:33px;width:120px;height:120px;background:#f4bd9d;border:5px solid #493249;border-radius:43%}
.hair{position:absolute;top:4px;left:29px;width:130px;height:52px;background:#85543e;border:5px solid #493249;border-radius:50% 50% 20% 20%;transform:rotate(-5deg)}
.eyes{position:absolute;top:72px;left:59px;font-size:22px;color:#477c60;letter-spacing:17px}
.mouth{position:absolute;top:107px;left:84px;color:#985269;font-size:24px}
.cat{position:absolute;left:15px;bottom:12px;font-size:45px}
.hearts{position:absolute;right:25px;bottom:40px;font-size:30px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
button{background:#f39bc2;color:#38233e;border:3px solid #ffe5ef;border-bottom:6px solid #a45a90;border-radius:17px;padding:10px 4px;min-height:78px;font-weight:800;font-size:13px;cursor:pointer}
button:active{transform:translateY(3px)}
button span{display:block;font-size:29px;margin-bottom:5px}
.panel{margin-top:14px;line-height:1.6}
.small{font-size:13px;color:#f6cfe7}
@keyframes bob{50%{transform:translateY(-7px)}}
</style>
</head>
<body>
<main>
<h1>👑 Тамагочи Муж ♡</h1>
<div class="stats" id="stats"></div>
<div class="room">
<div class="window">🌃</div>
<div class="lamp">💡</div>
<div class="bubble" id="speech">Как хорошо, что ты рядом! ♡</div>
<div class="character">
<div class="hoodie"></div>
<div class="face"></div>
<div class="hair"></div>
<div class="eyes" id="eyes">• •</div>
<div class="mouth" id="mouth">ᴗ</div>
</div>
<div class="cat">🐈</div>
<div class="hearts">💕</div>
</div>
<div class="actions" id="actions"></div>
<div class="panel">
<b id="level">👑 Уровень 1</b>
<span id="xp"></span>
<div class="small" id="achievement"></div>
</div>
<div class="panel">
<b>💌 Секретный сюрприз</b>
<div class="small" id="secret"></div>
</div>
<p class="small" style="text-align:center">Сделано с любовью ♡</p>
</main>
<script>
const key="tamagotchi-husband-save";
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
let s={
mood:75,food:65,energy:75,love:80,
xp:0,kisses:0,actions:0,...saved
};
const data=[
["🍔","Накормить","food",23,"А десерт будет?"],
["🫂","Обнять","love",18,"Иди обними настоящего мужа! ♡"],
["💋","Поцеловать","love",12,"Ещё разок? 🥹"],
["💻","На работу","energy",-17,"Excel открыт. Я очень занят!"],
["🎮","Развлечь","mood",21,"Ещё пять минуточек!"],
["😴","Уложить спать","energy",30,"Не будить до обеда!"],
["🏋️","Тренировка","energy",-13,"Где мой протеин?"],
["🎁","Сюрприз","love",22,"Ты лучшая! ❤️"],
["🐈","Погладить кота","mood",15,"Кота любят больше меня!"]
];
const names=[
["mood","💗 Настроение"],
["food","🍔 Сытость"],
["energy","⚡ Энергия"],
["love","💕 Любовь"]
];
const clamp=n=>Math.max(0,Math.min(100,n));
function render(){
document.getElementById("stats").innerHTML=names.map(([k,n])=>
`<div class="stat">${n} · ${s[k]}%
<div class="track"><div class="fill" style="width:${s[k]}%"></div></div>
</div>`).join("");
document.getElementById("level").textContent="👑 Уровень "+(Math.floor(s.xp/100)+1);
document.getElementById("xp").textContent=" · "+s.xp+" XP";
document.getElementById("achievement").textContent=
s.actions>=20?"🏆 Профессиональная жена Тамагочи":
s.kisses>=5?"🏅 Мастер поцелуев":
"Действий: "+s.actions+" · Поцелуев: "+s.kisses;
document.getElementById("secret").textContent=
s.kisses>=10?
"❤️ Спасибо, что ты есть в моей жизни. Ты мой самый любимый человек. Я люблю тебя больше, чем можно выразить пикселями! ♡":
"Поцелуй мужа ещё "+(10-s.kisses)+" раз, чтобы открыть письмо.";
}
function act(i){
const [emoji,name,k,n,phrase]=data[i];
s[k]=clamp(s[k]+n);
if(i===2)s.kisses++;
if(i===3)s.food=clamp(s.food-8);
if(i===5)s.food=clamp(s.food-5);
s.xp+=12;
s.actions++;
document.getElementById("speech").textContent=phrase;
document.getElementById("eyes").textContent=i===5?"– –":"◕ ◕";
document.getElementById("mouth").textContent=i===3?"﹏":"ᴗ";
localStorage.setItem(key,JSON.stringify(s));
render();
}
document.getElementById("actions").innerHTML=data.map((a,i)=>
`<button onclick="act(${i})"><span>${a[0]}</span>${a[1]}</button>`).join("");
render();
if(window.Telegram&&window.Telegram.WebApp){
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
