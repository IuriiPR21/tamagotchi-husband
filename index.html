
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тамагочи Муж 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#251b35;color:#fff2fb;font-family:system-ui,sans-serif}
main{max-width:550px;margin:auto;padding:16px 13px 42px}
h1{text-align:center;color:#ffc3dc;text-shadow:3px 3px #7e476f}
.sub{text-align:center;color:#e2c2e5;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat,.panel{background:#44314e;border:2px solid #b98eae;border-bottom:5px solid #74536f;border-radius:15px;padding:11px}
.stat{font-size:12px;font-weight:750}
.track{height:11px;background:#261b35;border-radius:20px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:#ff78ad;transition:width .35s}
.room{margin:13px 0;position:relative;height:335px;overflow:hidden;border:4px solid #b38aac;border-radius:17px;background:linear-gradient(#463456 0 64%,#83617d 64% 66%,#694963 66%)}
.window{position:absolute;right:14px;top:15px;width:115px;height:120px;background:#283457;border:9px solid #8c637e}
.window:after{content:"✦ ✧ ✦";position:absolute;top:21px;left:12px;color:#ffdb94}
.sofa{position:absolute;bottom:74px;left:24px;width:245px;height:110px;background:#a17b9e;border:8px solid #5a405e;border-radius:18px}
.lamp{position:absolute;top:48px;left:17px;font-size:42px}
.plant{position:absolute;top:95px;right:16px;font-size:44px}
.cat{position:absolute;bottom:40px;left:18px;font-size:42px}
.laptop{position:absolute;right:28px;bottom:51px;font-size:42px}
.speech{position:absolute;top:10px;left:12px;right:138px;min-height:68px;background:#fff0e8;border:3px solid #5d4059;border-radius:16px;color:#412b48;font-weight:800;padding:9px;text-align:center;font-size:13px;z-index:3}
.husband{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:135px;height:175px;animation:breathe 2s ease-in-out infinite;z-index:2}
.torso{position:absolute;top:107px;left:5px;width:125px;height:77px;background:#e3c5ad;border:5px solid #4d344b;border-radius:36px}
.head{position:absolute;top:20px;left:25px;width:88px;height:100px;background:#f4bc9b;border:5px solid #4d344b;border-radius:29px}
.hair{position:absolute;top:8px;left:20px;width:98px;height:43px;background:#83533d;border:5px solid #4d344b;border-radius:35px;transform:rotate(-7deg)}
.eyes{position:absolute;top:70px;left:45px;font-size:17px;letter-spacing:14px;color:#47725b}
.mouth{position:absolute;top:94px;left:65px;font-size:19px;color:#96556a}
.heart{position:absolute;right:110px;bottom:160px;font-size:23px;animation:float 2s infinite}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
button{border:2px solid #ffe0f0;border-bottom:5px solid #9a5989;background:#ed99c0;color:#40263f;border-radius:14px;padding:8px 3px;min-height:73px;font-size:12px;font-weight:850;cursor:pointer}
button:active{transform:translateY(3px)}
button .emoji{display:block;font-size:26px;margin-bottom:3px}
.panel{margin-top:12px;font-size:13px;line-height:1.55}
.panel h2{font-size:16px;margin:0 0 6px;color:#ffcae1}
.muted{color:#e6c5e2}
.row{display:flex;justify-content:space-between;align-items:center}
.tag{background:#e994bd;color:#422640;border-radius:15px;padding:4px 9px;font-weight:850}
.event{background:#654569;border-radius:10px;padding:10px;margin-top:8px}
.secondary{background:#cbb2e9}
.secret{background:#594063;border-radius:12px;padding:10px;margin-top:7px}
.foot{text-align:center;font-size:11px;color:#bfa5c8;margin-top:14px}
.bounce{animation:jump .5s ease-out!important}
@keyframes breathe{50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes jump{40%{transform:translateX(-50%) translateY(-24px)}}
@keyframes float{50%{transform:translateY(-15px)}}
</style>
</head>
<body>
<main>
<h1>👑 Тамагочи Муж ♡</h1>
<p class="sub">Пиксельная семейная жизнь · версия 2.0</p>
<div id="stats" class="stats"></div>
<div class="room">
<div class="window"></div>
<div class="sofa"></div>
<div class="lamp">💡</div>
<div class="plant">🪴</div>
<div class="cat">🐈</div>
<div class="laptop">💻</div>
<div class="speech" id="speech">Как хорошо, что ты рядом! ♡</div>
<div class="husband" id="husband">
<div class="torso"></div>
<div class="head"></div>
<div class="hair"></div>
<div class="eyes" id="eyes">• •</div>
<div class="mouth" id="mouth">ᴗ</div>
</div>
<div class="heart">💗</div>
</div>
<div id="actions" class="actions"></div>
<div class="panel">
<div class="row">
<span class="tag" id="level">👑 Уровень 1</span>
<b id="xp">0 XP</b>
</div>
<div class="muted" id="achievement"></div>
</div>
<div class="panel">
<h2>🎲 Случайное событие</h2>
<div class="event" id="event">Кажется, сегодня что-то случится...</div>
<button class="secondary" id="eventButton">🎲 Узнать, что случилось</button>
</div>
<div class="panel">
<h2>🎯 Задание для жены</h2>
<div id="task"></div>
<button class="secondary" id="taskButton">✨ Выполнено!</button>
</div>
<div class="panel">
<h2>💌 Секретное письмо</h2>
<div class="secret" id="secret"></div>
</div>
<p class="foot">С любовью, от настоящего мужа ♡</p>
</main>
<script>
const key="tamagotchi-husband-save";
const now=Date.now();
let old={};
try{old=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
let s={
mood:75,food:65,energy:75,love:80,
xp:0,kisses:0,actions:0,events:0,
taskDone:false,lastSeen:now,...old
};
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const elapsed=Math.min(48,Math.max(0,(now-s.lastSeen)/3600000));
s.food=clamp(s.food-elapsed*2);
s.energy=clamp(s.energy-elapsed);
s.mood=clamp(s.mood-elapsed*.6);
const labels=[
["mood","💗 Настроение"],
["food","🍔 Сытость"],
["energy","⚡ Энергия"],
["love","💕 Любовь"]
];
const actions=[
["🍔","Накормить","food",23,"А десерт будет?"],
["🫂","Обнять","love",18,"Виртуальные объятия не считаются!"],
["💋","Поцеловать","love",12,"Ещё разок? 🥹"],
["💻","На работу","energy",-16,"Я открыл Excel. Я занят!"],
["🎮","Развлечь","mood",22,"Ещё пять минуточек!"],
["😴","Уложить спать","energy",28,"Разбуди к ужину!"],
["🏋️","Тренировка","energy",-12,"Где мой протеин?"],
["🎁","Сюрприз","love",20,"Ты лучшая! ❤️"],
["🐈","Погладить кота","mood",14,"Кота опять любят больше!"]
];
const events=[
["Кот занял твоё место на диване!","mood",-8],
["Нашёл забытый шоколад!","mood",13],
["Муж потерял второй носок!","energy",-6],
["Внезапно захотелось обниматься!","love",9],
["Пятница! Хотя сегодня среда.","mood",11],
["Муж посмотрел цены на видеокарты.","mood",-5],
["Кот разрешил себя погладить!","mood",12]
];
const tasks=[
"Обними настоящего мужа на 10 секунд 🫂",
"Выбери фильм для вашего вечера 🎬",
"Скажи мужу неожиданный комплимент 💕",
"Сделайте смешное совместное селфи 📸",
"Предложи домашнее свидание 🍿"
];
function save(){
s.lastSeen=Date.now();
localStorage.setItem(key,JSON.stringify(s));
}
function render(){
document.getElementById("stats").innerHTML=
labels.map(([k,label])=>`
<div class="stat">${label} · ${s[k]}%
<div class="track">
<div class="fill" style="width:${s[k]}%"></div>
</div></div>`).join("");
document.getElementById("level").textContent=
"👑 Уровень "+(Math.floor(s.xp/100)+1);
document.getElementById("xp").textContent=s.xp+" XP";
document.getElementById("achievement").textContent=
s.actions>=30?"🏆 Легендарная жена":
s.kisses>=10?"🏅 Королева поцелуев":
s.actions>=10?"🌟 Заботливая жена":
"Действий: "+s.actions+" · Поцелуев: "+s.kisses;
document.getElementById("secret").textContent=
s.kisses>=10?
"❤️ Ты мой любимый человек. Спасибо, что делаешь мою жизнь счастливее каждый день. Люблю тебя! ♡":
"🔒 Осталось "+Math.max(0,10-s.kisses)+" поцелуев.";
document.getElementById("task").textContent=
tasks[Math.floor((s.actions+s.events)/5)%tasks.length];
document.getElementById("taskButton").textContent=
s.taskDone?"✓ Выполнено!":"✨ Выполнено!";
document.getElementById("taskButton").disabled=s.taskDone;
}
function react(message,type){
document.getElementById("speech").textContent=message;
document.getElementById("eyes").textContent=
type==="sleep"?"– –":type==="work"?"• •":"◕ ◕";
document.getElementById("mouth").textContent=
type==="work"?"﹏":"ᴗ";
const h=document.getElementById("husband");
h.classList.remove("bounce");
void h.offsetWidth;
h.classList.add("bounce");
}
function act(i){
const a=actions[i];
s[a[2]]=clamp(s[a[2]]+a[3]);
if(i===2)s.kisses++;
if(i===3)s.food=clamp(s.food-7);
if(i===5)s.food=clamp(s.food-4);
s.xp+=12;
s.actions++;
if(s.actions%5===0)s.taskDone=false;
react(a[4],i===5?"sleep":i===3?"work":"happy");
save();
render();
}
document.getElementById("actions").innerHTML=
actions.map((a,i)=>`
<button data-i="${i}">
<span class="emoji">${a[0]}</span>${a[1]}
</button>`).join("");
document.getElementById("actions").addEventListener("click",e=>{
const b=e.target.closest("button");
if(b)act(Number(b.dataset.i));
});
document.getElementById("eventButton").onclick=()=>{
const e=events[Math.floor(Math.random()*events.length)];
s[e[1]]=clamp(s[e[1]]+e[2]);
s.events++;
s.xp+=8;
document.getElementById("event").textContent=e[0];
react(e[0],"happy");
save();
render();
};
document.getElementById("taskButton").onclick=()=>{
if(s.taskDone)return;
s.taskDone=true;
s.xp+=25;
s.love=clamp(s.love+10);
react("Ты сделала мой день лучше! ♡","happy");
save();
render();
};
render();
save();
if(window.Telegram?.WebApp){
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
